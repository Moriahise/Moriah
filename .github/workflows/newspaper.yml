name: MORIAH · collect, translate & publish
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - '*.md'
      - 'docs/**'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: moriah-publication
  # A source fix replaces an older runtime; scheduled collections remain serialized.
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend test tools
        run: npm ci --ignore-scripts
      - name: Restore local translation models
        uses: actions/cache@v4
        with:
          path: ~/.cache/moriah-models
          key: moriah-opus-v1-${{ runner.os }}
      - name: Restore rendered weekly PDFs
        uses: actions/cache@v4
        with:
          path: .pdf-cache
          key: moriah-pdf-v1-${{ hashFiles('data/issues/*.json') }}
          restore-keys: moriah-pdf-v1-
      - name: Ensure Hebrew fonts and PDF layout libraries
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-dejavu-core libpango-1.0-0 libpangoft2-1.0-0
      - name: Install publishing tools
        run: pip install -r requirements.txt
      - name: Collect and translate sources
        run: python scripts/pipeline.py
      - name: Refresh studies, Niggunim and Sanhedrin cards
        run: python scripts/ecosystem.py
      - name: Bundle Jewish calendar and integrations
        run: npm run build:integrations
      - name: Validate source and edition logic
        run: python -m unittest discover -s tests -v
      - name: Check bilingual interface, search and filters
        timeout-minutes: 3
        run: npm test
      - name: Build newspaper and both print editions
        run: python scripts/build.py
      - name: Verify PDFs and generated links
        run: python scripts/verify_build.py
      - name: Save the validated collection and frozen editions
        run: |
          git config user.name 'moriah-publication[bot]'
          git config user.email 'moriah-publication[bot]@users.noreply.github.com'
          git add data index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Update MORIAH source desk and weekly edition'
            git push
          fi
      - name: Upload complete website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Deploy newspaper
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
      - name: Pages activation needed
        if: steps.pages.outcome != 'success'
        run: |
          echo '::warning::Activate Settings → Pages → Source: GitHub Actions once. The newspaper data and downloadable website artifact have been built successfully.'
          echo '## One-time Pages activation' >> "$GITHUB_STEP_SUMMARY"
          echo 'Settings → Pages → Build and deployment → Source: GitHub Actions. Then rerun this workflow.' >> "$GITHUB_STEP_SUMMARY"


